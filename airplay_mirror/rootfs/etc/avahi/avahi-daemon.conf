[server]
host-name=airplay-mirror
use-ipv4=yes
use-ipv6=no
disallow-other-stacks=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-workstation=no
publish-hinfo=no
publish-addresses=yes
publish-domain=yes

[reflector]
enable-reflector=no

[rlimits]
