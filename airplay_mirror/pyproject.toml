[project]
name = "airplay-mirror"
version = "0.1.0"
description = "Virtual AirPlay speakers that relay audio to groups of real AirPlay speakers"
readme = "DOCS.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
airplay-mirror = "airplay_mirror.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airplay_mirror*"]

[tool.setuptools.package-data]
airplay_mirror = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
